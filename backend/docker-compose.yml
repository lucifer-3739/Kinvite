version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: kinvite-redis-queue
    ports:
      - "6379:6379"
    restart: always

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: kinvite-go-gateway
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379
      - PORT=8080
    depends_on:
      - redis
    restart: always

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: kinvite-python-worker
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
    restart: always
