<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Deep Burgundy Radial & Linear Gradients -->
    <linearGradient id="burgundy-main" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#9E1B32" />
      <stop offset="40%" stop-color="#730F20" />
      <stop offset="80%" stop-color="#4A0813" />
      <stop offset="100%" stop-color="#2D030A" />
    </linearGradient>

    <linearGradient id="burgundy-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E0B1A" />
      <stop offset="100%" stop-color="#200206" />
    </linearGradient>

    <linearGradient id="burgundy-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BA2640" />
      <stop offset="100%" stop-color="#6E0D1E" />
    </linearGradient>

    <!-- Metallic Satin Gold Gradients -->
    <linearGradient id="gold-satin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0D0" />
      <stop offset="25%" stop-color="#E5C17B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA8022" />
      <stop offset="100%" stop-color="#F3E2B6" />
    </linearGradient>

    <linearGradient id="gold-ribbon-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FDF1D6" />
      <stop offset="100%" stop-color="#C59B27" />
    </linearGradient>

    <linearGradient id="gold-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F6B12" />
      <stop offset="100%" stop-color="#4A3403" />
    </linearGradient>

    <!-- Invitation Card Gradients -->
    <linearGradient id="card-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FAF5EC" />
      <stop offset="100%" stop-color="#F1E8D5" />
    </linearGradient>

    <!-- Leaf Gradients -->
    <linearGradient id="leaf-burgundy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E1428" />
      <stop offset="100%" stop-color="#4A0813" />
    </linearGradient>

    <linearGradient id="leaf-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8E5BA" />
      <stop offset="100%" stop-color="#C2982B" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g id="kinvite-logo-mark">
    <!-- 1. BOTANICAL BRANCH (Behind Card) -->
    <g id="botanical-branch">
      <!-- Main Stem -->
      <path d="M 345 220 Q 380 150 410 85" stroke="#3D060F" stroke-width="4" stroke-linecap="round" fill="none" />
      
      <!-- Leaf 1 (Left Lower - Burgundy) -->
      <path d="M 370 175 Q 350 160 360 145 Q 375 160 370 175 Z" fill="url(#leaf-burgundy)" />
      
      <!-- Leaf 2 (Right Mid - Gold) -->
      <path d="M 382 155 Q 410 145 425 160 Q 400 170 382 155 Z" fill="url(#leaf-gold)" />

      <!-- Leaf 3 (Right Lower - Burgundy) -->
      <path d="M 365 190 Q 395 195 408 215 Q 385 215 365 190 Z" fill="url(#leaf-burgundy)" />

      <!-- Heart Bud at Top -->
      <path d="M 410 85 C 400 65 380 70 380 85 C 380 100 410 120 410 120 C 410 120 440 100 440 85 C 440 70 420 65 410 85 Z" fill="url(#burgundy-main)" />
    </g>

    <!-- 2. INVITATION CARD -->
    <g id="invitation-card" filter="url(#card-shadow)">
      <rect x="250" y="105" width="115" height="155" rx="8" transform="rotate(18 250 105)" fill="url(#card-surface)" stroke="url(#gold-satin)" stroke-width="2" />
      <!-- Heart on Card -->
      <path d="M 292 188 C 286 178 274 180 274 190 C 274 200 292 212 292 212 C 292 212 310 200 310 190 C 310 180 298 178 292 188 Z" fill="#750E1F" />
    </g>

    <!-- 3. LETTER 'K' MAIN VERTICAL STEM (Serif style) -->
    <g id="stem-vertical">
      <!-- Stem Body & Serifs -->
      <path d="M 75 130 C 105 130 118 135 125 155 L 125 365 C 118 385 105 390 75 390 L 235 390 C 205 390 192 385 185 365 L 185 155 C 192 135 205 130 235 130 Z" fill="url(#burgundy-main)" />
      <!-- Stem Left Bevel Highlight -->
      <path d="M 125 155 L 135 160 L 135 360 L 125 365 Z" fill="url(#burgundy-highlight)" opacity="0.6" />
      <!-- Stem Right Core Shadow -->
      <path d="M 175 155 L 185 155 L 185 365 L 175 360 Z" fill="url(#burgundy-dark)" opacity="0.8" />
    </g>

    <!-- 4. UPPER RIGHT DIAGONAL ARM OF 'K' -->
    <g id="upper-arm">
      <path d="M 185 240 Q 230 160 275 140 Q 240 200 220 255 Z" fill="url(#burgundy-main)" />
      <!-- Back Shadow Curve behind ribbon -->
      <path d="M 220 255 Q 260 170 300 135 C 285 180 250 250 215 270 Z" fill="url(#burgundy-dark)" />
    </g>

    <!-- 5. LOWER RIGHT SWEEPING TAIL OF 'K' -->
    <g id="lower-tail">
      <path d="M 180 255 Q 240 280 320 350 Q 380 390 415 390 C 370 390 310 360 255 315 Q 210 280 180 255 Z" fill="url(#burgundy-main)" />
      <!-- Tail Bottom Shadow Depth -->
      <path d="M 230 295 Q 310 350 415 390 C 360 390 285 355 215 290 Z" fill="url(#burgundy-dark)" />
    </g>

    <!-- 6. SWIRLING METALLIC GOLD RIBBON -->
    <g id="golden-ribbon" filter="url(#card-shadow)">
      <!-- Ribbon Underpass Shadow -->
      <path d="M 105 345 Q 170 240 255 210 Q 320 190 380 205 C 330 200 270 215 215 245 Q 150 280 105 345 Z" fill="url(#gold-shadow)" opacity="0.7" />

      <!-- Main Flowing Ribbon -->
      <path d="M 110 340 Q 175 230 260 205 Q 340 185 420 235 C 410 270 380 215 315 205 Q 235 200 175 250 Q 130 290 110 340 Z" fill="url(#gold-satin)" />

      <!-- Ribbon Front Highlight Crest -->
      <path d="M 115 330 Q 180 230 265 205 Q 325 190 380 210 C 330 200 270 210 220 235 Q 160 265 115 330 Z" fill="url(#gold-ribbon-top)" />

      <!-- Lower Ribbon Tail Accent -->
      <path d="M 220 300 Q 260 360 350 395 C 300 390 250 355 220 300 Z" fill="url(#gold-satin)" />
    </g>

    <!-- 7. SPARKS & SHIMMER ACCENTS -->
    <g id="sparks">
      <!-- Sparkle Star 1 -->
      <path d="M 370 120 Q 370 130 380 130 Q 370 130 370 140 Q 370 130 360 130 Q 370 130 370 120 Z" fill="#FFF5DB" />
      <!-- Sparkle Star 2 -->
      <path d="M 240 190 Q 240 196 246 196 Q 240 196 240 202 Q 240 196 234 196 Q 240 196 240 190 Z" fill="#FFE29A" />
      <!-- Small Light Dots -->
      <circle cx="395" cy="140" r="1.5" fill="#FFF" />
      <circle cx="150" cy="230" r="1.5" fill="#FFE8B2" />
    </g>
  </g>
</svg>
