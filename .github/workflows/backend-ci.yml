name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - new-landing-page
    paths:
      - 'backend/**'
  pull_request:
    branches:
      - main
      - new-landing-page
    paths:
      - 'backend/**'

jobs:
  test-go:
    name: Go Gateway Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/gateway/go.sum

      - name: Install dependencies
        run: cd backend/gateway && go mod download

      - name: Run Gateway Tests
        run: cd backend/gateway && go test -v ./...

      - name: Compile Gateway Build Test
        run: cd backend/gateway && CGO_ENABLED=0 go build -v -o main .

  test-python:
    name: Python Worker Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/worker/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/worker/requirements.txt

      - name: Run Worker Tests
        run: python -m pytest backend/worker/

  docker-build:
    name: Docker Compilation & Compose Assemble Check
    runs-on: ubuntu-latest
    needs: [test-go, test-python]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Compose Compilation
        run: docker compose -f backend/docker-compose.yml build
